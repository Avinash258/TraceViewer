[project]
name = "apiextracter"
version = "1.0.0"
description = "Extract a Postman Collection JSON from a Playwright trace.zip"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "API Extracter" }]

[project.scripts]
apiextracter = "apiextracter.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apiextracter*"]
